name: safaqat
description: A new Flutter project.
publish_to: none
version: 1.0.0+1
environment: {sdk: '>=2.17.6 <3.0.0'}

dependencies:
  flutter: {sdk: flutter}
  cupertino_icons: ^1.0.5
  get: ^4.6.5
  retrofit: ^3.0.1+1
  dio: ^4.0.6
  dio_logging_interceptor: ^1.0.1
  shared_preferences: ^2.0.15
  tuple: ^2.0.0
  flutter_svg: ^1.0.4
  flutter_spinkit: ^5.1.0
  fluttertoast: ^8.0.9
  lottie: ^1.0.1
  crypto: ^3.0.1
  convert: ^3.0.0
  flutter_screenutil: ^5.0.0+2
  dio_cookie_manager: ^2.0.0
  json_annotation: ^4.6.0
  image_picker: ^0.8.5+3
#  syncfusion_flutter_datepicker: ^20.2.49
  date_time_picker: ^2.1.0

dev_dependencies:
  flutter_test: {sdk: flutter}
  retrofit_generator: ^4.0.3+2
  build_runner: ^2.2.1
  json_serializable: ^6.3.2
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets: [assets/drawable/]
  fonts:
  - family: Cairo
    fonts:
    - {asset: assets/fonts/cairo/cairo_bold.ttf}
